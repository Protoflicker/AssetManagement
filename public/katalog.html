<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Katalog Aset</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body data-page="katalog" style="background: var(--bg)">
    <!-- top bar -->
    <header
      style="
        background: rgb(11, 17, 32);
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: rgba(0, 0, 0, 0.25) 0 2px 16px;
      "
    >
      <div
        style="
          max-width: 1180px;
          margin: 0 auto;
          padding: 0.85rem 1.25rem;
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >
        <a
          href="katalog.html"
          style="text-decoration: none; display: flex; flex-direction: column"
        >
          <span
            style="
              font-size: 1.15rem;
              font-weight: 900;
              color: #fff;
              letter-spacing: -0.5px;
              line-height: 1;
            "
            >SES<span style="color: rgb(99, 102, 241)">DIAN</span></span
          >
          <span
            style="
              font-size: 0.55rem;
              color: rgb(100, 116, 139);
              font-family: 'JetBrains Mono';
              letter-spacing: 2px;
              margin-top: 3px;
            "
            >ASSET MANAGEMENT</span
          >
        </a>
        <div style="flex: 1"></div>
        <div data-guest-auth></div>
      </div>
    </header>

    <main style="max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem">
      <div style="margin-bottom: 1.25rem">
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-bottom: 4px">
          Katalog Aset
        </h1>
        <p data-catalog-sub style="color: var(--text-muted); font-size: 0.9rem">
          Memuat katalog…
        </p>
      </div>

      <div
        style="
          position: relative;
          margin-bottom: 1rem;
          max-width: 460px;
        "
      >
        <span
          class="ic"
          style="
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
          "
        ></span>
        <input
          data-search
          placeholder="Cari nama, kode, atau merek aset…"
          style="
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
            background: #fff;
            box-sizing: border-box;
          "
        />
      </div>

      <div
        data-cat-filters
        style="
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 6px;
          margin-bottom: 1.25rem;
        "
      ></div>

      <div
        data-catalog-grid
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 1rem;
        "
      >
        <div class="sesd-loading">Memuat katalog…</div>
      </div>
    </main>

    <footer
      style="
        text-align: center;
        color: var(--text-muted);
        font-size: 0.78rem;
        padding: 2rem 1rem;
      "
    >
      Untuk meminjam aset, silakan
      <a href="login.html" style="font-weight: 700">masuk</a> terlebih dahulu.
    </footer>

    <script defer src="assets/config.js"></script>
    <script defer src="assets/db.js"></script>
    <script defer src="assets/icons.js"></script>
    <script defer src="assets/guest.js"></script>
  </body>
</html>
