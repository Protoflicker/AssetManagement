<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Verifikasi</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('sesdian_theme')==='dark')d.setAttribute('data-theme','dark');var ts=localStorage.getItem('sesdian_textsize');if(ts==='small'||ts==='large')d.setAttribute('data-textsize',ts);if(localStorage.getItem('sesdian_rail')==='1')d.classList.add('sesd-rail-pref');}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/app.css?v=54" />
    <link rel="stylesheet" href="assets/preloader.css?v=54" />
  </head>
  <body
    data-page="verifikasi"
    data-auth="required"
    data-roles="admin,verifikator"
  >
    <div id="root">
      <div style="display: flex; min-height: 100vh; background: rgb(240, 244, 255)">
        <aside
          data-shell
          style="
            width: 256px;
            background: rgb(11, 17, 32);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: rgba(0, 0, 0, 0.25) 4px 0 32px;
          "
        ></aside>
        <main style="flex: 1 1 0%; overflow: auto; min-width: 0">
          <div
            data-topbar
            style="
              background: #fff;
              border-bottom: 1px solid rgb(226, 232, 240);
              padding: 0.7rem 1rem;
              display: flex;
              align-items: center;
              justify-content: space-between;
              position: sticky;
              top: 0;
              z-index: 10;
              box-shadow: rgba(0, 0, 0, 0.04) 0 1px 0;
            "
          ></div>
          <div style="padding: 1.75rem">
            <div class="animate-fade-up" style="margin-bottom: 1.25rem">
              <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 4px">
                Verifikasi Peminjaman
              </h1>
              <p style="color: var(--text-muted); font-size: 0.875rem">
                Verifikasi kedua (oleh verifikator) untuk peminjaman yang sudah
                disetujui admin.
              </p>
            </div>

            <div
              class="animate-fade-up delay-1"
              style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 0.75rem;
                margin-bottom: 1.25rem;
              "
            >
              <div
                style="
                  background: #fff;
                  border-radius: 12px;
                  padding: 1rem 1.1rem;
                  border-left: 4px solid rgb(245, 158, 11);
                  box-shadow: var(--shadow);
                "
              >
                <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px;">
                  <div data-count="approved" style="font-size: 1.8rem; font-weight: 800; color: rgb(245, 158, 11); line-height: 1;">0</div>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgb(245,158,11)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28" style="opacity: 0.8;"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: 500">Menunggu Verifikasi</div>
              </div>
              <div
                style="
                  background: #fff;
                  border-radius: 12px;
                  padding: 1rem 1.1rem;
                  border-left: 4px solid rgb(16, 185, 129);
                  box-shadow: var(--shadow);
                "
              >
                <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px;">
                  <div data-count="verified" style="font-size: 1.8rem; font-weight: 800; color: rgb(16, 185, 129); line-height: 1;">0</div>
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgb(16,185,129)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28" style="opacity: 0.8;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                </div>
                <div style="font-size: 0.82rem; color: var(--text-muted); font-weight: 500">Sudah Diverifikasi</div>
              </div>
            </div>

            <div
              class="animate-fade-up delay-2"
              style="
                background: #fff;
                border-radius: 16px;
                box-shadow: var(--shadow);
                overflow: auto;
              "
            >
              <table style="width: 100%; border-collapse: collapse; min-width: 640px">
                <thead style="background: rgb(248, 250, 255)">
                  <tr>
                    <th style="padding: 0.875rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px">Aset</th>
                    <th style="padding: 0.875rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px">Peminjam</th>
                    <th style="padding: 0.875rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px">Jumlah</th>
                    <th style="padding: 0.875rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px">Status</th>
                    <th style="padding: 0.875rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px">Jatuh Tempo</th>
                  </tr>
                </thead>
                <tbody data-list="verif">
                  <tr
                    data-template
                    data-search-item="verif"
                    data-status="approved"
                    style="border-top: 1px solid var(--border)"
                  >
                    <td data-bind="asset_name" style="padding: 0.875rem 1rem; font-weight: 600; font-size: 0.875rem">
                      -
                      <div data-bind="asset_code" style="font-size: 0.72rem; color: var(--text-muted); font-family: 'JetBrains Mono'">-</div>
                    </td>
                    <td data-bind="borrower" style="padding: 0.875rem 1rem; font-size: 0.875rem; color: var(--text-muted)">-</td>
                    <td data-bind="qty" style="padding: 0.875rem 1rem; font-size: 0.875rem">-</td>
                    <td style="padding: 0.875rem 1rem">
                      <span
                        style="display: inline-flex; align-items: center; gap: 6px; background: rgb(219, 234, 254); color: rgb(30, 64, 175); padding: 0.25rem 0.65rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700"
                      >
                        <span style="width: 6px; height: 6px; border-radius: 50%; background: rgb(30, 64, 175); flex-shrink: 0"></span>
                        <span data-bind="status_badge">-</span>
                      </span>
                    </td>
                    <td data-bind="due_date" style="padding: 0.875rem 1rem; font-size: 0.85rem; font-family: 'JetBrains Mono'; color: var(--text-muted)">-</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script defer src="assets/config.js?v=54"></script>
    <script defer src="assets/db.js?v=54"></script>
    <script defer src="assets/icons.js?v=54"></script>
    <script defer src="assets/preloader.js?v=54"></script>
    <script defer src="assets/app.js?v=54"></script>
      <script defer src="assets/theme.js?v=54"></script>
  </body>
</html>
