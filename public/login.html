<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Masuk</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{if(localStorage.getItem('sesdian_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/app.css?v=12" />
  </head>
  <body data-page="login">
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          background: linear-gradient(
            135deg,
            rgb(15, 23, 42) 0%,
            rgb(30, 41, 59) 50%,
            rgb(49, 46, 129) 100%
          );
          position: relative;
          overflow: hidden;
        "
      >
        <div
          style="
            position: absolute;
            left: -10%;
            top: 20%;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.15);
            pointer-events: none;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: -5%;
            top: 60%;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            pointer-events: none;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: 70%;
            top: 10%;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            pointer-events: none;
          "
        ></div>
        <div
          style="
            position: absolute;
            left: 80%;
            top: 70%;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.12);
            pointer-events: none;
          "
        ></div>
        <div
          class="animate-fade-up"
          style="
            flex: 1 1 0%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            position: relative;
            z-index: 1;
          "
        >
          <div style="max-width: 480px">
            <div
              style="
                display: inline-flex;
                align-items: center;
                gap: 12px;
                margin-bottom: 2rem;
              "
            >
              <div
                style="
                  width: 48px;
                  height: 48px;
                  border-radius: 14px;
                  background: linear-gradient(
                    135deg,
                    rgb(99, 102, 241),
                    rgb(139, 92, 246)
                  );
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 1.5rem;
                "
              >
                <span class="ic"
                  ><svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    width="1em"
                    height="1em"
                    aria-hidden="true"
                  >
                    <path d="M21 8 12 3 3 8v8l9 5 9-5z" />
                    <path d="M3 8l9 5 9-5M12 13v8" /></svg
                ></span>
              </div>
              <div>
                <div
                  style="
                    color: rgb(255, 255, 255);
                    font-weight: 800;
                    font-size: 1.4rem;
                    letter-spacing: -0.5px;
                  "
                >
                  SES<span style="color: rgb(99, 102, 241)">DIAN</span>
                </div>
                <div
                  style="
                    color: rgb(71, 85, 105);
                    font-size: 0.65rem;
                    font-family: &quot;JetBrains Mono&quot;;
                    letter-spacing: 2px;
                  "
                >
                  ASSET MANAGEMENT
                </div>
              </div>
            </div>
            <h1
              style="
                color: rgb(255, 255, 255);
                font-size: 2.5rem;
                font-weight: 800;
                line-height: 1.15;
                margin-bottom: 1rem;
              "
            >
              Kelola Aset<br /><span style="color: rgb(99, 102, 241)"
                >Lebih Cerdas.</span
              >
            </h1>
            <p
              style="
                color: rgb(100, 116, 139);
                font-size: 1rem;
                line-height: 1.7;
              "
            >
              Sistem manajemen peminjaman aset terintegrasi dengan notifikasi
              WhatsApp otomatis dan audit trail lengkap.
            </p>
            <div style="display: flex; gap: 1.5rem; margin-top: 2rem">
              <div style="display: flex; align-items: center; gap: 6px">
                <span
                  ><span class="ic"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      width="1em"
                      height="1em"
                      aria-hidden="true"
                    >
                      <rect x="5" y="11" width="14" height="9" rx="2" />
                      <path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg></span></span
                ><span style="color: rgb(100, 116, 139); font-size: 0.85rem"
                  >Aman</span
                >
              </div>
              <div style="display: flex; align-items: center; gap: 6px">
                <span
                  ><span class="ic"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      width="1em"
                      height="1em"
                      aria-hidden="true"
                    >
                      <path d="M13 2 4 14h7l-1 8 9-12h-7z" /></svg></span></span
                ><span style="color: rgb(100, 116, 139); font-size: 0.85rem"
                  >Real-time</span
                >
              </div>
              <div style="display: flex; align-items: center; gap: 6px">
                <span
                  ><span class="ic"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      width="1em"
                      height="1em"
                      aria-hidden="true"
                    >
                      <rect x="7" y="2" width="10" height="20" rx="2" />
                      <path d="M11 18h2" /></svg></span></span
                ><span style="color: rgb(100, 116, 139); font-size: 0.85rem"
                  >WhatsApp</span
                >
              </div>
            </div>
          </div>
        </div>
        <div
          style="
            width: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
          "
        >
          <div
            class="animate-fade-up delay-2"
            style="
              background: rgba(255, 255, 255, 0.05);
              backdrop-filter: blur(20px);
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 24px;
              padding: 2.5rem;
              width: 100%;
              box-shadow: rgba(0, 0, 0, 0.4) 0px 24px 64px;
            "
          >
            <h2
              style="
                color: rgb(255, 255, 255);
                font-weight: 800;
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
              "
            >
              Masuk
            </h2>
            <p
              style="
                color: rgb(100, 116, 139);
                font-size: 0.875rem;
                margin-bottom: 1.75rem;
              "
            >
              Gunakan NIP dan password Anda
            </p>
            <div style="margin-bottom: 1rem">
              <label
                style="
                  font-size: 0.75rem;
                  font-weight: 700;
                  color: rgb(148, 163, 184);
                  display: block;
                  margin-bottom: 6px;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                "
                >NIP</label
              ><input
                data-field="nip"
                placeholder="18 digit NIP Anda"
                value=""
                style="
                  display: block;
                  width: 100%;
                  padding: 0.75rem 1rem;
                  border-radius: 10px;
                  border: 1.5px solid rgba(255, 255, 255, 0.1);
                  background: rgba(255, 255, 255, 0.05);
                  color: rgb(255, 255, 255);
                  font-size: 0.9rem;
                  outline: none;
                  box-sizing: border-box;
                  transition: border-color 0.2s;
                  font-family: &quot;Inter&quot;, sans-serif;
                "
              />
            </div>
            <div style="margin-bottom: 1.5rem">
              <label
                style="
                  font-size: 0.75rem;
                  font-weight: 700;
                  color: rgb(148, 163, 184);
                  display: block;
                  margin-bottom: 6px;
                  text-transform: uppercase;
                  letter-spacing: 0.5px;
                "
                >Password</label
              >
              <div style="position: relative">
                <input
                  data-field="password"
                  placeholder="Password"
                  type="password"
                  value=""
                  style="
                    display: block;
                    width: 100%;
                    padding: 0.75rem 3rem 0.75rem 1rem;
                    border-radius: 10px;
                    border: 1.5px solid rgba(255, 255, 255, 0.1);
                    background: rgba(255, 255, 255, 0.05);
                    color: rgb(255, 255, 255);
                    font-size: 0.9rem;
                    outline: none;
                    box-sizing: border-box;
                    transition: border-color 0.2s;
                    font-family: &quot;Inter&quot;, sans-serif;
                  "
                /><button
                  data-action="toggle-password"
                  style="
                    position: absolute;
                    right: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: none;
                    border-width: medium;
                    border-style: none;
                    border-color: currentcolor;
                    border-image: initial;
                    color: rgb(100, 116, 139);
                    cursor: pointer;
                    font-size: 1rem;
                  "
                >
                  <span class="ic"
                    ><svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      width="1em"
                      height="1em"
                      aria-hidden="true"
                    >
                      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                      <circle cx="12" cy="12" r="3" /></svg
                  ></span>
                </button>
              </div>
            </div>
            <button
              data-action="login"
              style="
                width: 100%;
                padding: 0.875rem;
                background: linear-gradient(
                  135deg,
                  rgb(99, 102, 241),
                  rgb(139, 92, 246)
                );
                color: rgb(255, 255, 255);
                border-width: medium;
                border-style: none;
                border-color: currentcolor;
                border-image: initial;
                border-radius: 12px;
                cursor: pointer;
                font-weight: 700;
                font-size: 0.95rem;
                transition: 0.2s;
                box-shadow: rgba(99, 102, 241, 0.4) 0px 4px 16px;
              "
            >
              Masuk
            </button>
            <p
              style="
                text-align: center;
                margin-top: 1.25rem;
                font-size: 0.85rem;
                color: rgb(100, 116, 139);
              "
            >
              Akun dibuat oleh admin. Hanya ingin melihat aset?
              <a
                href="katalog.html"
                style="color: rgb(129, 140, 248); font-weight: 600"
                >Lihat katalog</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script defer src="assets/db.js?v=12"></script>
    <script defer src="assets/icons.js?v=12"></script>
    <script defer src="assets/app.js?v=12"></script>
      <script defer src="assets/theme.js?v=12"></script>
