<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Sedang Dipinjam</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('sesdian_theme')==='dark')d.setAttribute('data-theme','dark');var ts=localStorage.getItem('sesdian_textsize');if(ts==='small'||ts==='large')d.setAttribute('data-textsize',ts);if(localStorage.getItem('sesdian_rail')==='1')d.classList.add('sesd-rail-pref');}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/app.css?v=32" />
    <link rel="stylesheet" href="assets/preloader.css?v=32" />
  </head>
  <body data-page="dipinjam" data-auth="required">
    <div id="root">
      <div style="display: flex; min-height: 100vh; background: rgb(240, 244, 255)">
        <aside
          data-shell
          style="
            width: 256px;
            background: rgb(11, 17, 32);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: rgba(0, 0, 0, 0.25) 4px 0 32px;
          "
        ></aside>
        <main style="flex: 1 1 0%; overflow: auto; min-width: 0">
          <div
            data-topbar
            style="
              background: #fff;
              border-bottom: 1px solid rgb(226, 232, 240);
              padding: 0.7rem 1rem;
              display: flex;
              align-items: center;
              justify-content: space-between;
              position: sticky;
              top: 0;
              z-index: 10;
              box-shadow: rgba(0, 0, 0, 0.04) 0 1px 0;
            "
          ></div>
          <div style="padding: 1.75rem">
            <div class="animate-fade-up" style="margin-bottom: 1.25rem">
              <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 4px">
                Sedang Dipinjam
              </h1>
              <p style="color: var(--text-muted); font-size: 0.875rem">
                Barang yang masih di tangan peminjam (belum dikembalikan).
              </p>
            </div>

            <div
              class="animate-fade-up delay-1"
              style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 0.75rem;
                margin-bottom: 1.25rem;
              "
            >
              <div style="background: #fff; border-radius: 12px; padding: 1rem 1.1rem; border-left: 4px solid rgb(139, 92, 246); box-shadow: var(--shadow)">
                <div data-count="borrowed" style="font-size: 1.6rem; font-weight: 800; color: rgb(139, 92, 246)">0</div>
                <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 500">Dipinjam</div>
              </div>
              <div style="background: #fff; border-radius: 12px; padding: 1rem 1.1rem; border-left: 4px solid rgb(245, 158, 11); box-shadow: var(--shadow)">
                <div data-count="return_pending" style="font-size: 1.6rem; font-weight: 800; color: rgb(245, 158, 11)">0</div>
                <div style="font-size: 0.78rem; color: var(--text-muted); font-weight: 500">Menunggu Verifikasi Kembali</div>
              </div>
            </div>

            <div class="animate-fade-up delay-2" data-dipinjam></div>
          </div>
        </main>
      </div>
    </div>
    <script defer src="assets/config.js?v=32"></script>
    <script defer src="assets/db.js?v=32"></script>
    <script defer src="assets/icons.js?v=32"></script>
    <script defer src="assets/preloader.js?v=32"></script>
    <script defer src="assets/app.js?v=32"></script>
      <script defer src="assets/theme.js?v=32"></script>
  </body>
</html>
