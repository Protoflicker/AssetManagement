<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESDIAN — Daftar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body data-page="register">
<div id="root"><div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgb(15, 23, 42), rgb(30, 41, 59), rgb(49, 46, 129)); padding: 2rem; position: relative; overflow: hidden;"><div style="position: absolute; top: -20%; left: -10%; width: 500px; height: 500px; border-radius: 50%; background: rgba(99, 102, 241, 0.1); pointer-events: none;"></div><div style="position: absolute; bottom: -20%; right: -10%; width: 400px; height: 400px; border-radius: 50%; background: rgba(139, 92, 246, 0.08); pointer-events: none;"></div><div class="animate-fade-up" style="background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 480px; box-shadow: rgba(0, 0, 0, 0.4) 0px 24px 64px; position: relative; z-index: 1;"><div style="text-align: center; margin-bottom: 2rem;"><div style="font-size: 2rem; margin-bottom: 8px;">📦</div><h1 style="color: rgb(255, 255, 255); font-weight: 800; font-size: 1.5rem;">Buat Akun SESDIAN</h1><p style="color: rgb(100, 116, 139); font-size: 0.85rem; margin-top: 4px;">Isi data diri Anda untuk mendaftar</p></div><div style="margin-bottom: 0.875rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Nama Lengkap</label><div style="position: relative;"><span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem;">👤</span><input data-field="name" placeholder="Nama Lengkap" type="text" value="" style="display: block; width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"></div></div><div style="margin-bottom: 0.875rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">NIP (18 digit)</label><div style="position: relative;"><span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem;">🪪</span><input data-field="nip" placeholder="NIP (18 digit)" type="text" value="" style="display: block; width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"></div></div><div style="margin-bottom: 0.875rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Email</label><div style="position: relative;"><span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem;">📧</span><input data-field="email" placeholder="Email" type="email" value="" style="display: block; width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"></div></div><div style="margin-bottom: 0.875rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">No. HP (WhatsApp)</label><div style="position: relative;"><span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1rem;">📱</span><input data-field="phone" placeholder="No. HP (WhatsApp)" type="text" value="" style="display: block; width: 100%; padding: 0.7rem 1rem 0.7rem 2.5rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"></div></div><div style="margin-bottom: 0.875rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Password</label><div style="position: relative;"><span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);">🔒</span><input data-field="password" placeholder="Min. 8 karakter" type="password" value="" style="display: block; width: 100%; padding: 0.7rem 3rem 0.7rem 2.5rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"><button data-action="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border-width: medium; border-style: none; border-color: currentcolor; border-image: initial; color: rgb(100, 116, 139); cursor: pointer;">👁️</button></div></div><div style="margin-bottom: 1.5rem;"><label style="font-size: 0.78rem; font-weight: 700; color: rgb(148, 163, 184); display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Konfirmasi Password</label><input data-field="confirm" placeholder="Ulangi password" type="password" value="" style="display: block; width: 100%; padding: 0.7rem 1rem; border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); color: rgb(255, 255, 255); font-size: 0.875rem; outline: none; box-sizing: border-box; transition: border-color 0.2s; font-family: &quot;Plus Jakarta Sans&quot;, sans-serif;"></div><button data-action="register" style="width: 100%; padding: 0.875rem; background: linear-gradient(135deg, rgb(99, 102, 241), rgb(139, 92, 246)); color: rgb(255, 255, 255); border-width: medium; border-style: none; border-color: currentcolor; border-image: initial; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.95rem; box-shadow: rgba(99, 102, 241, 0.4) 0px 4px 16px; transition: transform 0.2s; opacity: 1;">Daftar Sekarang →</button><p style="text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: rgb(100, 116, 139);">Sudah punya akun? <a href="login.html" style="color: rgb(129, 140, 248); font-weight: 600;">Masuk di sini</a></p></div></div></div>
  <script src="assets/app.js" defer></script>
</body>
</html>
