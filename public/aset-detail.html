<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Detail Aset</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/app.css" />
  </head>
  <body data-page="aset-detail" style="background: var(--bg)">
    <header
      style="
        background: rgb(11, 17, 32);
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: rgba(0, 0, 0, 0.25) 0 2px 16px;
      "
    >
      <div
        style="
          max-width: 720px;
          margin: 0 auto;
          padding: 0.85rem 1.25rem;
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >
        <a
          href="katalog.html"
          style="
            color: rgb(148, 163, 184);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
          "
          >‹ Katalog</a
        >
        <div style="flex: 1"></div>
        <div data-guest-auth></div>
      </div>
    </header>

    <main style="max-width: 720px; margin: 0 auto; padding: 1.75rem 1.25rem">
      <div
        data-detail-root
        style="
          background: #fff;
          border-radius: 18px;
          border: 1px solid var(--border);
          box-shadow: var(--shadow);
          padding: 1.25rem;
        "
      >
        <div class="sesd-loading">Memuat detail aset…</div>
      </div>
    </main>

    <script defer src="assets/config.js"></script>
    <script defer src="assets/db.js"></script>
    <script defer src="assets/icons.js"></script>
    <script defer src="assets/guest.js"></script>
  </body>
</html>
