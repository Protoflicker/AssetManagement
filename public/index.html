<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Asset Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0f172a;
        font-family: "Inter", system-ui, sans-serif;
      }
      .boot {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #94a3b8;
      }
    </style>
    <script>
      // Root bootstrap: signed-in users go to the dashboard; guests get the
      // public catalog (browse without login; borrowing still requires login).
      try {
        // 'sesdian_token' = real (Neon) session; 'sesdian_user' = demo session
        var signedIn =
          localStorage.getItem("sesdian_token") ||
          localStorage.getItem("sesdian_user");
        location.replace(signedIn ? "dashboard.html" : "katalog.html");
      } catch (e) {
        location.replace("katalog.html");
      }
    </script>
  </head>
  <body>
    <div class="boot">Memuat SESDIAN…</div>
      <script defer src="assets/theme.js?v=16"></script>
  </body>
</html>
