<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Katalog Aset</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{if(localStorage.getItem('sesdian_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/app.css?v=14" />
  </head>
  <body data-page="katalog" style="background: var(--bg)">
    <!-- top bar -->
    <header
      style="
        background: rgb(11, 17, 32);
        position: sticky;
        top: 0;
        z-index: 10;
        box-shadow: rgba(0, 0, 0, 0.25) 0 2px 16px;
      "
    >
      <div
        style="
          max-width: 1180px;
          margin: 0 auto;
          padding: 0.85rem 1.25rem;
          display: flex;
          align-items: center;
          gap: 14px;
        "
      >
        <a
          href="katalog.html"
          style="text-decoration: none; display: flex; flex-direction: column"
        >
          <span
            style="
              font-size: 1.15rem;
              font-weight: 900;
              color: #fff;
              letter-spacing: -0.5px;
              line-height: 1;
            "
            >SES<span style="color: rgb(99, 102, 241)">DIAN</span></span
          >
          <span
            style="
              font-size: 0.55rem;
              color: rgb(100, 116, 139);
              font-family: 'JetBrains Mono';
              letter-spacing: 2px;
              margin-top: 3px;
            "
            >ASSET MANAGEMENT</span
          >
        </a>
        <div style="flex: 1"></div>
        <div data-guest-auth></div>
      </div>
    </header>

    <main style="max-width: 1180px; margin: 0 auto; padding: 1.75rem 1.25rem">
      <div
        class="animate-fade-up"
        style="
          background: linear-gradient(135deg, rgb(15, 23, 42) 0%, rgb(30, 41, 59) 50%, rgb(49, 46, 129) 100%);
          border-radius: 20px;
          padding: 2rem 2.5rem;
          margin-bottom: 1.5rem;
          position: relative;
          overflow: hidden;
        "
      >
        <div style="position: absolute; top: -40px; right: -40px; width: 200px; height: 200px; border-radius: 50%; background: rgba(99, 102, 241, 0.15)"></div>
        <div style="position: absolute; bottom: -60px; right: 80px; width: 150px; height: 150px; border-radius: 50%; background: rgba(139, 92, 246, 0.1)"></div>
        <div style="position: relative">
          <div style="font-size: 0.72rem; color: rgb(99, 102, 241); font-weight: 700; letter-spacing: 2px; margin-bottom: 8px; font-family: 'JetBrains Mono'">
            KATALOG PUBLIK
          </div>
          <h1 style="color: #fff; font-size: 1.75rem; font-weight: 800; margin-bottom: 6px">
            Katalog Aset
          </h1>
          <p data-catalog-sub style="color: rgb(148, 163, 184); font-size: 0.9rem">
            Memuat katalog…
          </p>
        </div>
      </div>

      <div
        style="
          position: relative;
          margin-bottom: 1rem;
          max-width: 460px;
        "
      >
        <span
          class="ic"
          style="
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
          "
          ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="1em" height="1em" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg
        ></span>
        <input
          data-search
          placeholder="Cari nama, kode, atau merek aset…"
          style="
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.8rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
            background: #fff;
            box-sizing: border-box;
          "
        />
      </div>

      <div
        data-cat-filters
        style="
          display: flex;
          gap: 8px;
          overflow-x: auto;
          padding-bottom: 6px;
          margin-bottom: 1.25rem;
        "
      ></div>

      <div
        data-catalog-grid
        style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
          gap: 1rem;
        "
      >
        <div class="sesd-loading">Memuat katalog…</div>
      </div>
    </main>

    <footer
      style="
        text-align: center;
        color: var(--text-muted);
        font-size: 0.78rem;
        padding: 2rem 1rem;
      "
    >
      Untuk meminjam aset, silakan
      <a href="login.html" style="font-weight: 700">masuk</a> terlebih dahulu.
    </footer>

    <script defer src="assets/config.js?v=14"></script>
    <script defer src="assets/db.js?v=14"></script>
    <script defer src="assets/icons.js?v=14"></script>
    <script defer src="assets/guest.js?v=14"></script>
      <script defer src="assets/theme.js?v=14"></script>
  </body>
</html>
