<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SESDIAN - Masuk</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script>(function(){try{var d=document.documentElement;if(localStorage.getItem('sesdian_theme')==='dark')d.setAttribute('data-theme','dark');var ts=localStorage.getItem('sesdian_textsize');if(ts==='small'||ts==='large')d.setAttribute('data-textsize',ts);if(localStorage.getItem('sesdian_rail')==='1')d.classList.add('sesd-rail-pref');}catch(e){}})();</script>
    <link rel="stylesheet" href="assets/app.css?v=55" />
  </head>
  <body data-page="login">
    <div id="root">
      <div class="sesd-login">
        <div class="sesd-login__brandpane animate-fade-up">
          <img
            class="sesd-login__logo"
            src="assets/logosesdian.png"
            alt="SESDIAN — Asset Management"
          />
          <h1 class="sesd-login__title">
            Kelola Aset<br /><span>Lebih Cerdas.</span>
          </h1>
          <p class="sesd-login__lead">
            Sistem manajemen peminjaman aset terintegrasi dengan notifikasi
            WhatsApp otomatis dan audit trail lengkap.
          </p>
        </div>
        <div class="sesd-login__formpane">
          <div class="sesd-login__card animate-fade-up delay-2">
            <h2>Masuk</h2>
            <p class="sub">Gunakan NIP dan password Anda</p>
            <div style="margin-bottom: 1rem">
              <label class="sesd-login__label">NIP</label>
              <input
                class="sesd-login__input"
                data-field="nip"
                placeholder="18 digit NIP Anda"
                value=""
              />
            </div>
            <div style="margin-bottom: 1.5rem">
              <label class="sesd-login__label">Password</label>
              <div style="position: relative">
                <input
                  class="sesd-login__input"
                  data-field="password"
                  placeholder="Password"
                  type="password"
                  value=""
                  style="padding-right: 3rem"
                /><button
                  class="sesd-login__eye"
                  data-action="toggle-password"
                  aria-label="Tampilkan password"
                >
                  <span class="ic"
                    ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="1em" height="1em" aria-hidden="true">
                      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
                      <circle cx="12" cy="12" r="3" /></svg
                  ></span>
                </button>
              </div>
            </div>
            <button class="sesd-login__submit" data-action="login">Masuk</button>
            <p class="sesd-login__foot">
              Akun dibuat oleh admin. Hanya ingin melihat aset?
              <a href="katalog.html" style="color: var(--primary); font-weight: 600">Lihat katalog</a>
            </p>
          </div>
        </div>
      </div>
    </div>
    <script defer src="assets/config.js?v=55"></script>
    <script defer src="assets/db.js?v=55"></script>
    <script defer src="assets/icons.js?v=55"></script>
    <script defer src="assets/app.js?v=55"></script>
      <script defer src="assets/theme.js?v=55"></script>
  </body>
</html>
